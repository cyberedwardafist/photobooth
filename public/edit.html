<head>

<title>Edit strip | photobooth</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700&display=swap" rel="stylesheet">

<body>
<nav class="in"><a class="logo" href="index.html">photobooth</a><div><a href="index.html">Home</a><a href="template.html">Template</a></div></nav>
<section class="editwrap pgsec">
  <div class="head"><h2>Edit strip lalu unduh</h2><p>Foto diproses di browsermu dan tidak diunggah ke mana pun.</p></div>
  <div class="msg" id="msg"><p id="msgT">Memuat foto...</p><a class="btn" id="msgA" href="foto.html" hidden>Ambil foto dulu</a></div>
  <div class="edit" id="ui" hidden>

    <div class="panel">
      <h3>Template</h3><div class="row" id="tpls"><div class="state">Memuat template...</div></div>

      <h3>Filter foto</h3><div class="row" id="fil"></div>
      <p class="note" id="filNote" hidden>Peramban ini belum mendukung filter foto.</p>
      <button class="btn big" id="dl">Unduh strip PNG</button>
      <a class="btn alt big" href="foto.html">Ubah foto</a>
    </div>
  </div>
</section>
<footer><span>photobooth</span><a href="admin.html">Masuk admin</a></footer>
