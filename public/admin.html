<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin photobooth</title>
<link rel="icon" type="image/svg+xml" href="logo-mark.svg">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#2F5BB5;--sky:#83C2F8;--mist:#DBE2F8;--cream:#F5E6D5;--pink:#E6A5C3;--ink:#1E2D5A}
*{box-sizing:border-box;margin:0}
body{font:500 17px/1.6 Nunito,system-ui,sans-serif;color:var(--ink);background:var(--sky);min-height:100vh}
h1,h2{font-family:Fredoka,Nunito,sans-serif;font-weight:600;line-height:1.15}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 20px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer;text-decoration:none}
.btn:hover{background:#264A95}
.btn.alt{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.alt:hover{background:var(--mist)}
.card{background:#fff;border-radius:18px;padding:26px}
.wrap{max-width:760px;margin:0 auto;padding:6vh 5vw}
label{display:grid;gap:4px;font-weight:700;margin-bottom:14px}
input[type=text],input[type=password]{min-height:46px;padding:0 12px;border:2px solid #7C8DBA;border-radius:10px;background:#fff}
.err{background:#FBE3EE;border-radius:10px;padding:10px 14px;margin-bottom:14px}
.err[hidden],[hidden]{display:none!important}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.top div{display:flex;gap:8px}
.big{font:600 48px Fredoka,sans-serif}
.tp{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:2px solid var(--mist);flex-wrap:wrap}
.tp .dot{width:34px;height:34px;border-radius:8px;box-shadow:inset 0 0 0 2px var(--ink);display:grid;place-items:center;font:600 16px Fredoka,sans-serif}
.tp b{flex:1;min-width:120px}
.add{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.add label{margin:0}
input[type=color]{min-height:46px;width:64px;padding:2px;border:2px solid #7C8DBA;border-radius:10px;background:#fff}
.stack{display:grid;gap:18px}
svg{display:block;margin:0 auto 14px}
.train{animation:go 5s ease-in-out infinite alternate}
@keyframes go{to{transform:translateX(70px)}}

/* login admin */
#login{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:24px 5vw 150px;overflow:auto;
  background:radial-gradient(circle at 15% 15%,rgba(255,255,255,.55) 0,transparent 38%),radial-gradient(circle at 88% 30%,rgba(230,165,195,.55) 0,transparent 36%),linear-gradient(180deg,#83C2F8 0%,#B9DBFA 60%,#DBE2F8 100%)}
#login::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.55) 1.6px,transparent 1.7px);background-size:28px 28px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 65%);mask-image:linear-gradient(180deg,#000,transparent 65%)}
.lg-bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lg-scene{position:absolute;left:0;bottom:-2px;width:100%;height:min(262px,34vh);overflow:visible;display:block;margin:0}
.lg-train{animation:lgtrain 16s linear infinite}
@keyframes lgtrain{from{transform:translateX(-260px)}to{transform:translateX(1260px)}}
.lg-cloud{animation:lgcl 30s ease-in-out infinite alternate}.lg-cloud.b{animation-duration:42s}
@keyframes lgcl{to{transform:translateX(90px)}}
.lg-spk{position:absolute;width:30px;height:30px;fill:#fff;animation:lgtw 3.4s ease-in-out infinite}
.lg-spk.a{left:12%;top:20%}.lg-spk.b{right:14%;top:14%;width:22px;height:22px;animation-delay:-1.2s;fill:var(--pink)}.lg-spk.c{right:26%;top:62%;width:18px;height:18px;animation-delay:-2.2s}
@keyframes lgtw{50%{transform:scale(.55) rotate(25deg);opacity:.6}}
.lg-card{position:relative;width:min(440px,100%);padding:56px 34px 28px;border:2px solid var(--ink);border-radius:28px;background:#fff;box-shadow:0 10px 0 rgba(30,45,90,.9),0 30px 50px rgba(30,45,90,.25);text-align:center;margin-top:34px}
.lg-badge{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);display:grid;place-items:center;width:84px;height:84px;border-radius:26px;background:var(--cream);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.lg-card h1{font-size:34px}
.lg-sub{margin:6px auto 22px;font-size:15.5px;max-width:30ch;line-height:1.45}
.lg-card form{text-align:left}
.lg-card label{margin-bottom:16px}
.fld{position:relative;display:block;margin-top:4px;font-weight:500}
.fld>svg{position:absolute;left:14px;top:50%;width:20px;height:20px;margin:-10px 0 0;color:#5B6B98;pointer-events:none}
.fld input{width:100%;min-height:52px;padding:0 14px 0 46px;border:2px solid #9AA8CE;border-radius:14px;background:#F6F8FE;transition:border-color .12s,box-shadow .12s,background .12s}
.fld input::placeholder{color:#8794BB}
.fld input:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px rgba(47,91,181,.2)}
.fld input[type=password]{padding-right:52px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:42px;height:42px;border:0;border-radius:10px;background:none;cursor:pointer;color:#5B6B98}
.eye svg{width:20px;height:20px;margin:0}
.eye:hover{background:var(--mist);color:var(--ink)}
.eye[aria-pressed=true]{color:var(--blue)}
.lg-card .err{display:flex;gap:8px;align-items:center;border:2px solid #D9658F;font-weight:700;font-size:15px}
.lg-go{width:100%;min-height:54px;margin-top:4px;border-radius:16px;font-size:18px;box-shadow:0 5px 0 #1B3A7C;transition:transform .12s,box-shadow .12s}
.lg-go:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 0 #1B3A7C}
.lg-go:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #1B3A7C}
.lg-go:disabled{opacity:.6;cursor:wait}
.lg-back{display:inline-flex;align-items:center;min-height:44px;margin-top:14px;padding:0 14px;border-radius:999px;color:var(--ink);font-weight:700;font-size:15px;text-decoration:none}
.lg-back:hover{background:var(--mist)}
@media(max-width:520px){.lg-card{padding:54px 20px 20px;border-radius:24px}.lg-card h1{font-size:29px}#login{padding-bottom:120px}}
@media(max-height:640px){#login{place-items:start center;padding-top:50px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <div id="login" hidden>
    <div class="lg-bg" aria-hidden="true">
      <svg class="lg-spk a" viewBox="-16 -16 32 32"><path d="M0 -15 Q2 -2 15 0 Q2 2 0 15 Q-2 2 -15 0 Q-2 -2 0 -15Z"/></svg><svg class="lg-spk b" viewBox="-16 -16 32 32"><path d="M0 -15 Q2 -2 15 0 Q2 2 0 15 Q-2 2 -15 0 Q-2 -2 0 -15Z"/></svg><svg class="lg-spk c" viewBox="-16 -16 32 32"><path d="M0 -15 Q2 -2 15 0 Q2 2 0 15 Q-2 2 -15 0 Q-2 -2 0 -15Z"/></svg>
      <svg class="lg-scene" viewBox="0 0 1200 260" preserveAspectRatio="xMidYMax slice">
        <g fill="#fff" opacity=".9"><g class="lg-cloud"><ellipse cx="180" cy="60" rx="64" ry="20"/><ellipse cx="215" cy="46" rx="44" ry="22"/></g><g class="lg-cloud b"><ellipse cx="860" cy="90" rx="70" ry="20"/><ellipse cx="896" cy="75" rx="44" ry="22"/></g></g>
        <rect y="130" width="1200" height="130" fill="#5A8ADE"/>
        <g fill="none" stroke="#DBE2F8" stroke-width="4" stroke-linecap="round"><path d="M0 150q30-14 60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0"/><path d="M-30 176q30-14 60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0" opacity=".7"/></g>
        <rect y="208" width="1200" height="120" fill="#F5E6D5"/><rect y="214" width="1200" height="6" fill="#1E2D5A"/>
        <g class="lg-train"><rect x="0" y="146" width="90" height="62" rx="12" fill="#57A9B4"/><rect x="0" y="176" width="90" height="10" fill="#F5E6D5"/><rect x="12" y="158" width="22" height="18" rx="5" fill="#DBE2F8"/><rect x="42" y="158" width="22" height="18" rx="5" fill="#DBE2F8"/><rect x="100" y="146" width="120" height="62" rx="12" fill="#57A9B4"/><rect x="100" y="176" width="120" height="10" fill="#F5E6D5"/><rect x="112" y="158" width="22" height="18" rx="5" fill="#DBE2F8"/><rect x="176" y="154" width="44" height="22" rx="8" fill="#DBE2F8"/><circle cx="190" cy="164" r="3.5" fill="#1E2D5A"/><circle cx="208" cy="164" r="3.5" fill="#1E2D5A"/><path d="M192 170q8 6 14 0" fill="none" stroke="#1E2D5A" stroke-width="2.5" stroke-linecap="round"/><g fill="#1E2D5A"><circle cx="24" cy="212" r="7"/><circle cx="72" cy="212" r="7"/><circle cx="124" cy="212" r="7"/><circle cx="196" cy="212" r="7"/></g></g>
      </svg>
    </div>
    <div class="lg-card">
      <div class="lg-badge"><img src="logo-mark.svg" alt="" width="34" height="50"></div>
      <h1>Masuk admin</h1>
      <p class="lg-sub">Kelola template dan lihat jumlah strip yang diunduh.</p>
      <form id="form">
        <div class="err" id="err" role="alert" hidden></div>
        <label>Nama pengguna
          <span class="fld"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><input type="text" id="u" autocomplete="username" placeholder="Masukkan nama pengguna" required></span>
        </label>
        <label>Kata sandi
          <span class="fld"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><input type="password" id="p" autocomplete="current-password" placeholder="Masukkan kata sandi" required>
          <button type="button" class="eye" id="eye" aria-label="Tampilkan kata sandi" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></span>
        </label>
        <button class="btn lg-go" id="go" type="submit">Masuk</button>
      </form>
      <a class="lg-back" href="index.html">&larr; Kembali ke photobooth</a>
    </div>
  </div>

  <div id="dash" class="stack" hidden>
    <div class="top"><h1>Admin photobooth</h1><div><a class="btn alt" href="index.html">Lihat situs</a><button class="btn" id="out">Keluar</button></div></div>
    <div class="card"><p>Strip yang sudah diunduh</p><p class="big" id="dls">0</p></div>
    <div class="card"><h2 style="margin-bottom:8px">Template</h2><div id="list"><p>Memuat template...</p></div></div>
    <form class="card" id="addf"><h2 style="margin-bottom:14px">Tambah template</h2>
      <div class="err" id="err2" role="alert" hidden></div>
      <div class="add"><label>Nama<input type="text" id="n" maxlength="30" required></label><label>Latar<input type="color" id="b" value="#DBE2F8"></label><label>Teks<input type="color" id="i" value="#1E2D5A"></label><button class="btn" type="submit">Simpan template</button></div>
    </form>
  </div>
</main>
<script>
const $=s=>document.querySelector(s);
const api=async(u,o={})=>{const r=await fetch(u,{headers:{'Content-Type':'application/json'},...o,body:o.body?JSON.stringify(o.body):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||'Terjadi kesalahan'),{status:r.status});return j};
const show=d=>{$('#login').hidden=!!d;$('#dash').hidden=!d};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function draw(d){$('#dls').textContent=d.downloads;
  $('#list').innerHTML=d.templates.length?d.templates.map(t=>`<div class="tp"><span class="dot" style="background:${t.bg};color:${t.ink}">Aa</span><b>${esc(t.name)}</b><button class="btn alt" data-a="${t.id}" data-v="${!t.active}">${t.active?'Sembunyikan':'Tampilkan'}</button><button class="btn alt" data-d="${t.id}">Hapus</button></div>`).join(''):'<p>Belum ada template. Tambahkan satu di bawah.</p>';
  $('#list').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(`/api/admin/templates/${b.dataset.a}`,{method:'PATCH',body:{active:b.dataset.v==='true'}}));
  $('#list').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(confirm('Hapus template ini?'))act(`/api/admin/templates/${b.dataset.d}`,{method:'DELETE'})})}
async function act(u,o){try{draw(await api(u,o))}catch(e){e.status===401?show(false):alert(e.message)}}
async function boot(){try{draw(await api('/api/admin/data'));show(true)}catch{show(false)}}
$('#form').onsubmit=async e=>{e.preventDefault();$('#err').hidden=true;$('#go').disabled=true;
  try{await api('/api/admin/login',{method:'POST',body:{user:$('#u').value,pass:$('#p').value}});$('#p').value='';await boot()}
  catch(x){$('#err').textContent=x.message;$('#err').hidden=false}$('#go').disabled=false};
$('#addf').onsubmit=async e=>{e.preventDefault();$('#err2').hidden=true;
  try{draw(await api('/api/admin/templates',{method:'POST',body:{name:$('#n').value.trim(),bg:$('#b').value,ink:$('#i').value}}));$('#n').value=''}
  catch(x){$('#err2').textContent=x.message;$('#err2').hidden=false}};
$('#out').onclick=async()=>{await api('/api/admin/logout',{method:'POST'}).catch(()=>{});show(false)};
$('#eye').onclick=()=>{const p=$('#p'),on=p.type==='password';p.type=on?'text':'password';$('#eye').setAttribute('aria-pressed',on);$('#eye').setAttribute('aria-label',on?'Sembunyikan kata sandi':'Tampilkan kata sandi')};
boot();
</script>
</body>
</html>
